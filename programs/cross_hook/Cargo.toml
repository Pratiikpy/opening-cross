[package]
name = "cross_hook"
version = "0.1.0"
description = "Opening Cross transfer hook: allowlist passes and time locks enforced on every transfer of a gated mint."
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "cross_hook"

[features]
default = []
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "=1.0.2", features = ["init-if-needed"] }
anchor-spl = "=1.0.2"
spl-discriminator = "0.5"
spl-tlv-account-resolution = "0.11"
spl-transfer-hook-interface = "2"
spl-token-2022-interface = "2"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
