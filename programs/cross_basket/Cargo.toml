[package]
name = "cross_basket"
version = "0.1.0"
description = "Opening Cross baskets: a share token backed one for one by fixed amounts of several tokens, minted and redeemed against the vaults by anyone."
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "cross_basket"

[features]
default = ["no-log-ix-name"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = "=1.0.2"
anchor-spl = "=1.0.2"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
