[package]
name = "example_venue"
version = "0.1.0"
description = "Reference integration: a third-party program that routes its users' orders into Opening Cross with one CPI."
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "lib"]
name = "example_venue"

[features]
default = ["no-log-ix-name"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = { version = "=1.0.2", features = ["init-if-needed"] }
opening-cross-cpi = { path = "../../crates/opening-cross-cpi" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
