# Opening Cross backend: Postgres 17, the indexer, the API, the keeper, the promiser, the premium monitor, and
# Caddy for automatic HTTPS and WSS. Every service runs the same image (./Dockerfile) with a different command.
# Configuration comes from ./.env (copy .env.example); keypairs are mounted read-only from ./.secrets.
name: opening-bell

x-service: &service
  image: opening-bell-services:latest
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  logging:
    driver: json-file
    options:
      max-size: 20m
      max-file: "5"
  environment: &env
    DATABASE_URL: postgres://oc:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/oc
    RPC_URL: ${RPC_URL:-https://api.devnet.solana.com}
    NETWORK: ${NETWORK:-devnet}

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: oc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: oc
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oc -d oc"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"

  # One-shot: applies services/indexer/migrations before anything else starts, so no two services race to create
  # the schema.
  migrate:
    <<: *service
    restart: "no"
    build:
      context: ${REPO_ROOT:-..}
      dockerfile: deploy/Dockerfile
    working_dir: /app/services/api
    command: ["node", "--import", "tsx", "migrate.ts"]
    volumes:
      - ./migrate.ts:/app/services/api/migrate.ts:ro
    depends_on:
      db:
        condition: service_healthy

  indexer:
    <<: *service
    working_dir: /app/services/indexer
    command: ["node", "--import", "tsx", "src/main.ts"]
    environment:
      <<: *env
      POLL_MS: ${INDEXER_POLL_MS:-8000}
      RECONCILE_EVERY: ${INDEXER_RECONCILE_EVERY:-20}
    depends_on:
      migrate:
        condition: service_completed_successfully

  api:
    <<: *service
    working_dir: /app/services/api
    command: ["node", "--import", "tsx", "src/main.ts"]
    environment:
      <<: *env
      PORT: "8080"
      HOST: 0.0.0.0
      # Caddy is the only client the API sees; trust its X-Forwarded-For so the rate limiter counts real clients.
      TRUST_PROXY: "1"
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-600}
      PROMISE_SIGNER: ${PROMISE_SIGNER:?set PROMISE_SIGNER (the promiser's public key) in .env}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      # Wallets we operate (the keeper, promiser and market maker keys, the team wallets), comma-separated. /v1/metrics/external-flow
      # excludes them on top of each cross's own creator, proceeds recipient, integrator and fee recipient. Empty means only those.
      OWN_WALLETS: ${OWN_WALLETS:-}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/v1/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 15s
      timeout: 8s
      retries: 6
      start_period: 40s
    depends_on:
      migrate:
        condition: service_completed_successfully

  keeper:
    <<: *service
    working_dir: /app/services/keeper
    command: ["node", "--import", "tsx", "src/main.ts"]
    environment:
      <<: *env
      KEEPER_KEYPAIR: /run/secrets/keeper.json
      # Only act on crosses made by these creators; an empty value would make the keeper serve every cross on
      # the cluster, so the compose file refuses to start without it.
      KEEPER_CREATORS: ${KEEPER_CREATORS:?set KEEPER_CREATORS (comma-separated creator addresses) in .env}
      PASS_MS: ${KEEPER_PASS_MS:-15000}
      # Which optional duties to do (docs/CONFIGURATION.md): default, all, none, or a list. Add partner-fees to claim the protocol's DBC trading fees to the fee recipient,
      # locks to release vested locked fills, series to spawn recurring crosses. The default value is spelled out because an empty one would mean "none".
      KEEPER_DUTIES: ${KEEPER_DUTIES:-default}
      KEEPER_MIN_RELEASE: ${KEEPER_MIN_RELEASE:-1}
      KEEPER_PARTNER_FEE_EVERY_SECS: ${KEEPER_PARTNER_FEE_EVERY_SECS:-3600}
      KEEPER_MIN_PARTNER_QUOTE: ${KEEPER_MIN_PARTNER_QUOTE:-1}
      KEEPER_MIN_PARTNER_BASE: ${KEEPER_MIN_PARTNER_BASE:-1}
      # Issuer subscriptions: when KEEPER_BILLING_URL is set (the billing profile's service, http://billing:8791), the series duty spawns only for issuers with a paid period,
      # except the authorities in KEEPER_ENTITLEMENT_EXEMPT. Empty means every series in scope is served.
      KEEPER_BILLING_URL: ${KEEPER_BILLING_URL:-}
      KEEPER_ENTITLEMENT_EXEMPT: ${KEEPER_ENTITLEMENT_EXEMPT:-}
      KEEPER_BREAKER_FEEDS: ${KEEPER_BREAKER_FEEDS:-}
      # 1 plans every action and sends nothing, and logs what would have been sent.
      KEEPER_DRY_RUN: ${KEEPER_DRY_RUN:-}
    volumes:
      - ./.secrets/keeper.json:/run/secrets/keeper.json:ro
    depends_on:
      migrate:
        condition: service_completed_successfully

  promiser:
    <<: *service
    working_dir: /app/services/promiser
    command: ["node", "--import", "tsx", "src/main.ts"]
    environment:
      <<: *env
      PROMISE_KEYPAIR: /run/secrets/promiser.json
      ROUND_MS: ${PROMISER_ROUND_MS:-15000}
      ANCHOR_EVERY_MS: ${PROMISER_ANCHOR_MS:-600000}
      # The web app's public address. Set, the promiser also signs and anchors the receipt of every cross that has settled for good (ADR-0941); blank leaves that off.
      RECEIPT_URL: ${RECEIPT_URL:-}
      RECEIPT_PER_ROUND: ${RECEIPT_PER_ROUND:-20}
      RECEIPT_RECHECK_MS: ${RECEIPT_RECHECK_MS:-21600000}
    volumes:
      - ./.secrets/promiser.json:/run/secrets/promiser.json:ro
    depends_on:
      migrate:
        condition: service_completed_successfully

  # The premium monitor measures real MAINNET stock-token liquidity whatever cluster the rest of the stack follows,
  # so it ignores NETWORK/RPC_URL above and uses PREMIUM_RPC_URL.
  premium:
    <<: *service
    working_dir: /app/services/premium
    # TICKERS must be absent, not empty, to measure the full universe; the shell sets it only when given.
    command: ["sh", "-c", "if [ -n \"$$PREMIUM_TICKERS\" ]; then export TICKERS=\"$$PREMIUM_TICKERS\"; fi; exec node --import tsx src/main.ts"]
    environment:
      DATABASE_URL: postgres://oc:${POSTGRES_PASSWORD}@db:5432/oc
      RPC_URL: ${PREMIUM_RPC_URL:-https://api.mainnet-beta.solana.com}
      NETWORK: mainnet-beta
      ROUND_MS: ${PREMIUM_ROUND_MS:-60000}
      PREMIUM_TICKERS: ${PREMIUM_TICKERS:-}
    depends_on:
      migrate:
        condition: service_completed_successfully

  # ---- Optional services (docker compose --profile <name> up -d). None starts by default; each needs the variables named in
  # .env.example and refuses to start with a clear message when one is missing.

  # Typed event stream over gRPC (services/stream). Ports bind to localhost; reach it over an SSH tunnel or put TLS in front.
  stream:
    <<: *service
    profiles: ["stream"]
    working_dir: /app/services/stream
    command: ["node", "--import", "tsx", "src/main.ts"]
    environment:
      <<: *env
      STREAM_PORT: "50051"
      STREAM_HOST: 0.0.0.0
      STREAM_TOKEN: ${STREAM_TOKEN:-}
    ports:
      - "127.0.0.1:50051:50051"
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Issuer subscriptions (services/billing): plans, payments read back from the chain, entitlements, signed invoices.
  billing:
    <<: *service
    profiles: ["billing"]
    working_dir: /app/services/billing
    command: ["node", "--import", "tsx", "src/main.ts"]
    environment:
      <<: *env
      BILLING_HOST: 0.0.0.0
      BILLING_MINT: ${BILLING_MINT:-}
      REVENUE_WALLET: ${REVENUE_WALLET:-}
      BILLING_KEYPAIR: /run/secrets/billing.json
    volumes:
      - ./.secrets/billing.json:/run/secrets/billing.json:ro
    ports:
      - "127.0.0.1:8791:8791"
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Gate upkeep (services/keeper, src/main-gate.ts): closes the cross_gate passes anyone may close (terms lapsed, attestation gone, no longer conforming, wallet denied). The
  # rent goes to the pass owner; the keeper wallet pays only fees. It reads every Terms account of the gate program, so RPC_URL must allow getProgramAccounts, and it does
  # nothing until a gate has rules (the deployed cross_gate has none yet, HG5). It uses the keeper's key.
  gate-keeper:
    <<: *service
    profiles: ["gate"]
    working_dir: /app/services/keeper
    command: ["node", "--import", "tsx", "src/main-gate.ts"]
    environment:
      <<: *env
      KEEPER_KEYPAIR: /run/secrets/keeper.json
      PASS_MS: ${GATE_KEEPER_PASS_MS:-60000}
      # 1 names what would be closed and sends nothing.
      KEEPER_DRY_RUN: ${GATE_KEEPER_DRY_RUN:-}
    volumes:
      - ./.secrets/keeper.json:/run/secrets/keeper.json:ro

  # The documentation service (services/docs-mcp): the repository's documents as a searchable site, over MCP at /mcp and as JSON. Read-only: no key, no database. It reads
  # the Markdown documents the image holds (deploy/pack.sh puts them in), and by default leaves out runbooks and security notes. Caddy serves it on DOCS_SITE_HOST.
  docs:
    <<: *service
    profiles: ["docs"]
    working_dir: /app/services/docs-mcp
    command: ["node", "--import", "tsx", "src/main.ts"]
    environment:
      DOCS_HOST: 0.0.0.0
      DOCS_DIR: /app
      DOCS_KINDS: ${DOCS_KINDS:-}
      DOCS_PUBLIC_URL: ${DOCS_PUBLIC_URL:-}
      DOCS_RATE_PER_MINUTE: ${DOCS_RATE_PER_MINUTE:-120}
      # Caddy is the only client the service sees; read the real client from the address it forwards.
      DOCS_TRUST_PROXY: "1"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8793/healthz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 8s
      retries: 4
      start_period: 30s

  # Operations console API (services/ops): listing queue, incidents, cases, hash-chained audit log. It binds to loopback on the host and is never reachable through the
  # SITE_HOST block of the Caddyfile. A web app on another host reaches it only through the OPS_SITE_HOST block, which allows OPS_ALLOWED_IPS alone (deploy/README.md).
  ops:
    <<: *service
    profiles: ["ops"]
    working_dir: /app/services/ops
    command: ["node", "--import", "tsx", "src/main.ts"]
    environment:
      <<: *env
      OPS_HOST: 0.0.0.0
      OPS_TOKENS: ${OPS_TOKENS:-}
      OPS_API_URL: http://api:8080
      OPS_WEBHOOK_SECRET: ${OPS_WEBHOOK_SECRET:-}
      OPS_KEYPAIR: /run/secrets/ops.json
    volumes:
      - ./.secrets/ops.json:/run/secrets/ops.json:ro
    ports:
      - "127.0.0.1:8792:8792"
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Watches the protocol and reports. It only pauses when MONITOR_ARM=yes AND a guardian keypair is mounted; otherwise it is a dry run.
  monitor:
    <<: *service
    profiles: ["monitor"]
    working_dir: /app/services/monitor
    command: ["node", "--import", "tsx", "src/main.ts"]
    environment:
      <<: *env
      MONITOR_ARM: ${MONITOR_ARM:-}
      MONITOR_GUARDIAN_KEYPAIR: /run/secrets/guardian.json
      MONITOR_WEBHOOK_URL: ${MONITOR_WEBHOOK_URL:-}
      MONITOR_BACKING_URL: http://api:8080
      MONITOR_EXPECT_ADMIN: ${MONITOR_EXPECT_ADMIN:-}
      MONITOR_EXPECT_GUARDIAN: ${MONITOR_EXPECT_GUARDIAN:-}
      MONITOR_EXPECT_FEE_RECIPIENT: ${MONITOR_EXPECT_FEE_RECIPIENT:-}
    volumes:
      - ./.secrets/guardian.json:/run/secrets/guardian.json:ro
    depends_on:
      api:
        condition: service_healthy

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_HOST: ${SITE_HOST:?set SITE_HOST in .env}
      # Unset, these two names are the .localhost ones: served with Caddy's own certificate and unreachable from outside, so the docs service and the ops console API
      # are not public until a hostname is chosen on purpose.
      DOCS_SITE_HOST: ${DOCS_SITE_HOST:-docs.localhost}
      OPS_SITE_HOST: ${OPS_SITE_HOST:-ops.localhost}
      OPS_ALLOWED_IPS: ${OPS_ALLOWED_IPS:-127.0.0.1}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"

volumes:
  pgdata:
  caddy_data:
  caddy_config:
