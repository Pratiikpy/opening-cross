name: ci
on: [push, pull_request]
jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm test
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.1
        with: { components: "clippy, rustfmt" }
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --release
      - name: Conformance vectors are exactly what clearing-core generates
        run: cargo run -q --release -p clearing-core --example conformance_vectors > /tmp/v1.json && diff /tmp/v1.json packages/verifier/conformance/v1.json
  programs:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_PASSWORD: oc }
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.1
      - uses: Swatinem/rust-cache@v2
      - name: Install Agave 4.0.2 (cargo build-sbf)
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v4.0.2/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      - run: sh scripts/build-programs.sh
      - name: Adapter IDL copies match the programs' IDLs
        run: diff idls/cross_core.json packages/cross-core-client/idl/cross_core.json && diff idls/cross_gate.json packages/cross-gate-client/idl/cross_gate.json && diff idls/cross_core.json crates/opening-cross-cpi/idls/cross_core.json && diff idls/cross_gate.json crates/opening-cross-cpi/idls/cross_gate.json
      - run: sh tests/fixtures/fetch.sh
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @opening-cross/core-tests test
        env: { DATABASE_URL: 'postgres://postgres:oc@localhost:5432/postgres' }
      - name: Published packages run a full cross from a clean project
        run: sh examples/ts-quickstart/run.sh
      - name: CPI crate packages and builds on its own
        run: cargo package -p opening-cross-cpi
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
